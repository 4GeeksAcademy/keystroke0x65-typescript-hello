<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0607" />
    <title>Skylar Theatre · Cinema Seat Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div class="app" id="layout" data-layout="overlay">
      <section class="hall" id="hall" aria-label="Skylar Theatre main hall">
        <canvas
          id="scene"
          role="img"
          aria-label="3D view of the Skylar Theatre main hall. Reserved seats glow gold and selected seats glow red. Use the seat map to choose seats."
        ></canvas>
        <header class="marquee">
          <p class="eyebrow"><span class="mask"><span>Welcome to</span></span></p>
          <h1 class="wordmark"><span class="mask"><span>Skylar Theatre</span></span></h1>
          <p class="tagline"><span class="mask"><span>Cinema seat manager</span></span></p>
        </header>
        <p class="live"><span class="dot" aria-hidden="true"></span>Live seating</p>
        <p class="hint" id="hint" aria-hidden="true">Tap a seat in the hall to select it</p>
        <p class="fallback">The 3D hall couldn’t load in this browser. The seat map works as normal.</p>
        <div class="tip" id="tip" aria-hidden="true" hidden></div>
      </section>

      <main class="side" id="side" aria-label="Seat manager">
        <div class="panel" id="app"></div>
        <p id="seat-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="meta">
          <span>Rows A–H</span><span class="sep" aria-hidden="true">·</span><span>10 seats per row</span>
          <span class="sep" aria-hidden="true">·</span>
          <button type="button" class="link" id="motionToggle" aria-pressed="false">Pause animations</button>
          <span class="sep layout-only" aria-hidden="true">·</span>
          <button type="button" class="link layout-only" id="layoutToggle">Dock panel beside the hall</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
